interface:
  display_name: "Math & Science Computation"
  short_description: "Route computations efficiently and verify proportionately"
  default_prompt: >-
    Use $math-science-computation only for mathematics-related computation tasks; do not route unrelated work to it or perform work outside that scope. Define the computation and do a bounded mathematical-structure precheck before committing to a backend-dependent implementation. For nontrivial work that still requires computation, read or create the persistent local backend inventory first through the cross-platform Python entry; when Python is unavailable but PowerShell 7 is callable, use the PowerShell compatibility entry. Never require or install PowerShell merely to run inventory. Reject a snapshot recorded for another operating system or architecture. A valid cache hit must not start Mathematica, SageMath, Python, primecount, or any MCP tool; merge the cached local facts with the current session's advertised tools, choose a primary route and concrete fallback, and live-check only the selected backend. Treat persisted MCP information as historical only, because current MCP callability requires current-session discovery and an actual selected call. Refresh or invalidate only the affected local record when a recorded path disappears, a version materially changes, or execution fails.

    Always estimate feasibility first, especially for very large exact integers. Interpret 'enough to answer' from the requested deliverable: when the user explicitly asks for a concrete value and an allowed callable backend can reasonably finish, actual execution and delivery of the computed result are mandatory; do not return only code, an unevaluated expression, or an approximation for a feasible exact request. Warn about long runtime but continue; only the user may choose to terminate an otherwise feasible authorized computation. Stop after the requested result and proportionate verification are secure; do not add unrequested cross-validation, alternative full-range reruns, extra backends, or optional artifacts.

    Treat the evaluator timeConstraint and the outer MCP tool-call deadline as separate limits. Calibrate representative low, middle, and high-cost slices, keep each MCP chunk comfortably inside the shortest call window with a conservative safety margin, checkpoint completed chunks, and prove final non-overlapping coverage. After an actual MCP capability or prototype evaluation, route a workload that cannot fit MCP call windows to a monitorable local process with heartbeats, validated checkpoints, and idempotent resume; keep waiting while progress and resources remain healthy, and inspect whether work is still running before retrying after a timeout.

    When the user explicitly requests the fastest possible completion or minimum wall time, assess safe decomposition and parallel overhead, probe Wolfram MCP kernel capacity when Wolfram is primary, and attempt a faster valid multicore implementation only when it is likely to help; preserve correctness and fall back to the best serial route when parallelism is unavailable, unsafe, or slower. Select the best callable backend, and create a computation record only for requested reproducible/file delivery or high-assurance work. When Wolfram is primary or explicitly requested, discover and actually call WolframLanguageContext and WolframLanguageEvaluator when available; do not substitute a local script for a callable MCP evaluator. For exact prime-counting, try Wolfram MCP first; if it cannot return a concrete exact integer, use verified local primecount from the backend inventory with exact options and --double-check unless the user required MCP-only execution.
