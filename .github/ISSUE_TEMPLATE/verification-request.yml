name: Mathematical verification request
description: Request independent review of an exact frozen claim and dependencies.
title: "[verify] "
labels: ["kind:verification", "stage:review-gate"]
body:
  - type: input
    id: problem_id
    attributes:
      label: Project ID
      placeholder: P-0001
    validations:
      required: true
  - type: input
    id: claim_id
    attributes:
      label: Claim ID
    validations:
      required: true
  - type: input
    id: candidate
    attributes:
      label: Candidate path and SHA-256
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependency paths and SHA-256 values
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact checked scope and evidence standard
    validations:
      required: true
  - type: checkboxes
    id: isolation
    attributes:
      label: Isolation
      options:
        - label: Reviewer must not edit the candidate or consume unbound solver chat/staging.
          required: true
